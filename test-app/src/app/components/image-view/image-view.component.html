<section>
  <div class="container-fluid">
    <div class="row">
      <div class="col-12">
        <h3>View your Images</h3>
      </div>
      <div class="row">
        <div class="col-12">
          <div class="border border-radius-2 d-flex flex-row justify-content-center gap-4 align-items-center py-4 px-2">
            <div class="dropdown">
              <!-- 🔥 Fix: Added Bootstrap's dropdown toggle attribute -->
              <button class="btn btn-secondary dropdown-toggle" type="button" id="categoryDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                Categories
              </button>

              <!-- 🔥 Fix: Made dropdown menu dynamic using *ngFor -->
              <ul class="dropdown-menu" aria-labelledby="categoryDropdown">
                <li *ngFor="let category of categories">
                  <a class="dropdown-item" (click)="selectCategory(category)">{{ category }}</a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Show selected category images -->
    <div *ngIf="selectedCategory && categoryImages.length" class="overflow-y-auto my-5" style="max-height: 600px;">
      <div class="row">
        <div class="col-12 border border-radius-2">
          <div class="container-fluid">
            <h5>Images from Category: {{ selectedCategory }}</h5>
            <div class="row g-3">
              <div *ngFor="let image of categoryImages" class="col-lg-3 col-md-4 col-6">
                <div class="card">
                  <img [src]="image.previewPath" alt="Image" class="card-img-top img-fluid">
                  <div class="card-body">
                    <h6 class="card-title">{{ image.name }}</h6>
                    <div class="d-flex justify-content-center gap-2 align-items-center flex-wrap">
                      <button class="btn btn-primary btn-sm" (click)="openModal(image)">See Object</button>
                      <button class="btn btn-danger btn-sm" (click)="deleteImage(image._id)">Remove</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Custom Modal -->
    <div class="custom-modal-overlay" *ngIf="isModalOpen" (click)="closeModal()">
      <div class="custom-modal" (click)="$event.stopPropagation()">
        <div class="custom-modal-header">
          <h5>{{ modalImageName }}</h5>
          <button class="close-btn" (click)="closeModal()">✖</button>
        </div>
        <div class="custom-modal-body">
          <!-- Embed the ObjectViewerComponent and pass the objectPath -->
          <app-object-viewer [objectPath]="modalObjectPath"></app-object-viewer>
        </div>
      </div>
    </div>
  </div>
</section>
