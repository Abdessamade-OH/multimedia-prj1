<section>
  <div class="container my-5">
    <div class="row my-3">
      <div class="col-12">
        <h1 class="text-center">Upload Your Images and 3D Models!</h1>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <div class="border p-5">
          <h5 class="mb-5 text-center">Upload Images and 3D Models</h5>
          <form (ngSubmit)="onUploadImage()" class="d-flex flex-column gap-3 justify-content-center align-items-start" enctype="multipart/form-data">
            
            <!-- Image Category -->
            <div class="form-group w-100">
              <label for="image-category">Image Category</label>
              <select [(ngModel)]="imageCategory" name="category" id="image-category" class="form-control" required>
                <option *ngFor="let category of categories" [value]="category">{{ category }}</option>
              </select>
            </div>

            <!-- Image File Upload -->
            <div class="form-group w-100">
              <label for="image-file">Select Image Files</label>
              <input
                type="file"
                id="image-file"
                class="form-control"
                accept="image/*"
                (change)="onFileChange($event, 'image')"
                multiple
                required
              >
            </div>

            <!-- OBJ File Upload -->
            <div class="form-group w-100">
              <label for="obj-file">Select OBJ Files</label>
              <input
                type="file"
                id="obj-file"
                class="form-control"
                accept=".obj"
                (change)="onFileChange($event, 'obj')"
                multiple
                required
              >
            </div>

            <!-- Image Preview (for single file) -->
            <div class="form-group w-100" *ngIf="imagePreview">
              <h6 class="mt-3">Preview Image</h6>
              <img [src]="imagePreview" alt="Image Preview" class="img-fluid rounded border mt-2" style="max-height: 300px;">
            </div>

            <!-- Multiple Files Selected -->
            <div class="form-group w-100" *ngIf="multipleFilesSelected">
              <h6 class="mt-3">Files Selected:</h6>
              <ul class="mt-2">
                <li *ngFor="let file of selectedImageFiles">{{ file.name }}</li>
              </ul>
            </div>

            <!-- Error Message for OBJ File Mismatch -->
            <div *ngIf="!objFilesMatch" class="alert alert-danger mt-3">
              <p>The number of image files and OBJ files do not match. Please make sure each image has a corresponding OBJ file.</p>
            </div>

            <button type="submit" class="btn btn-primary mt-3" [disabled]="!objFilesMatch">Upload</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
